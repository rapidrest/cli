name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:lts-trixie-slim
    steps:
      - uses: actions/checkout@v6

      - name: Enable corepack
        run: npm install --global corepack && corepack enable

      - name: Cache node_modules, dist, docs
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            dist
            docs
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install system dependencies
        run: apt update && apt install build-essential python3 -y

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      - name: Lint
        run: yarn lint

  test:
    runs-on: ubuntu-latest
    container:
      image: node:lts-trixie-slim
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Enable corepack
        run: npm install --global corepack && corepack enable

      - name: Install system dependencies
        # git: the release tests run real git commands in temporary repositories.
        run: apt-get update && apt-get install -y --no-install-recommends build-essential python3 ca-certificates libcurl4 curl git

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Embedded Postgres (postgres-memory-server) refuses to run as root, the container's default user, so the tests
      # run as the image's unprivileged node user.
      - name: Run tests
        run: |
          chown -R node:node .
          su node -s /bin/sh -c 'HOME=/home/node yarn test'

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: junit.xml

      - name: Report coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./coverage/lcov.info

  validate:
    runs-on: ubuntu-latest
    container:
      image: node:lts-trixie-slim
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Enable corepack
        run: npm install --global corepack && corepack enable

      - name: Run validation script
        run: |
          set +e
          bash ./validate.sh
