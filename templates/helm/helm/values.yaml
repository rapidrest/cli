host: localhost
environment: dev
auth:
  audience: '{{ .Values.host }}'
  issuer: 'api.{{ .Values.host }}'
  expiresIn: 1 hour
  secret: '{{ randAlphaNum 32 }}'
cookies:
  secret: '{{ randAlphaNum 32 }}'
sessions:
  secret: '{{ randAlphaNum 32 }}'
common:
  storageClass: default
  logs:
    level: info
gateway:
  name: api-gateway
  namespace: '{{ .Release.Namespace }}'
  hsts: true
  tls: true
redis:
[[#if hasRedis]]
  create: true
[[/if]]
  url: 'redis://db-redis-master'
  architecture: standalone
  auth:
    enabled: true
  fullnameOverride: db-redis
  master:
    persistence:
      enabled: false
  replica:
    persistence:
      enabled: false
  networkPolicy:
    enabled: true
    allowExternal: false
mongodb:
[[#if hasMongoDB]]
  create: true
[[/if]]
  architecture: standalone
  fullnameOverride: mongodb
  auth:
    enabled: true
postgresql:
[[#if hasPostgres]]
  create: true
[[/if]]
  architecture: standalone
  fullnameOverride: postgresql
  auth:
    enablePostgresUser: true
    # PostgreSQL (unlike MongoDB) won't create databases on first connection, so only one
    # extra database is auto-provisioned here. The acl datastore below defaults to the
    # built-in "postgres" database; override service.postgresql.acl.name if you provision a
    # dedicated database for it out-of-band.
    database: '[[project_name]]'
service:
  image:
    registry: ghcr.io
    repository: [[project_name]]
    # Empty by default - the Deployment template falls back to `.Chart.AppVersion`. Override for a
    # specific release, e.g. via `--set service.image.tag=`.
    tag: ""
  replicas: 1
  # Modest defaults for a reference deployment - tune for your actual traffic before relying on these.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  mongodb:
    acl:
      name: access_control_lists
      host: ''
    mongo:
      name: [[project_name]]
      host: ''
  postgresql:
    acl:
      name: postgres
      host: ''
    sql:
      name: [[project_name]]
      host: ''
  config:
    logs: true
    metrics: true
    releaseNotes: true
