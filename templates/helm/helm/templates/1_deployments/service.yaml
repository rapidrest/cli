---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: [[project_name]]-services
  labels:
    app: [[project_name]]
    app.kubernetes.io/instance: [[project_name]]-services
    environment: {{ $.Values.environment }}
spec:
  replicas: {{ $.Values.service.replicas }}
  selector:
    matchLabels:
      app: [[project_name]]
  template:
    metadata:
      labels:
        app: [[project_name]]
        app.kubernetes.io/instance: [[project_name]]-services
        environment: {{ $.Values.environment }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      {{- if $.Values.service.imagePullSecret }}
      imagePullSecrets:
        - name: {{ $.Values.service.imagePullSecret }}
      {{- end }}
      containers:
        - name: [[project_name]]
          image: {{ $.Values.service.image.registry }}/{{ $.Values.service.image.repository }}:{{ $.Values.service.image.tag | default $.Chart.AppVersion }}
          {{- if eq ($.Values.service.image.tag | default $.Chart.AppVersion) "latest" }}
          imagePullPolicy: Always
          {{- else }}
          imagePullPolicy: IfNotPresent
          {{- end }}
          {{- if ne $.Values.environment "production" }}
          command: ["node"]
          args: ["--inspect=127.0.0.1:9229", "dist/src/server.js"]
          {{- end }}
          envFrom:
            - configMapRef:
                name: service-config
            {{- if $.Values.redis.create }}
            - secretRef:
                name: db-redis-info
            {{- end }}
            - secretRef:
                name: jwt-auth
            - secretRef:
                name: service-db-info
          ports:
            - containerPort: 3000
          resources:
            {{- toYaml $.Values.service.resources | nindent 12 }}
      initContainers:
        {{- if $.Values.redis.create }}
        {{- $redisHost := tpl $.Values.redis.url . | replace "redis://" "" }}
        - name: redis-probe
          image: busybox
          env:
            - name: REDIS_HOST
              value: {{ $redisHost }}
          command: ['sh', '-c', "until nc -z $REDIS_HOST 6379; do echo waiting for cache; sleep $(expr 2 + $RANDOM % 13); done"]
        {{- end }}
        {{- if $.Values.mongodb.create }}
        - name: mongo-probe
          image: busybox
          env:
            - name: MONGO_HOST
              value: {{ $.Values.mongodb.fullnameOverride }}
          command: ['sh', '-c', "until nc -z $MONGO_HOST 27017; do echo waiting for mongodb; sleep $(expr 2 + $RANDOM % 13); done"]
        {{- end }}
      {{- if $.Values.service.spec }}
      {{- range $k, $v := $.Values.service.spec }}
      {{- if kindIs "string" $v }}
      {{ $k }}: {{ tpl $v $ | quote }}
      {{- else }}
      {{ $k }}: {{ $v }}
      {{- end }}
      {{- end }}
      {{- end }}
